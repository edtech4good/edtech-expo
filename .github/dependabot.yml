version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Expo SDK packages move as a coordinated unit via 'expo install', not individually.
    # All major bumps elsewhere are deliberate tasks, not automatic updates.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-*/*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "metro*"
      - dependency-name: "babel-preset-expo"
      # Pinned by the Expo SDK in practice (expo install --check expects 6.5.1 on SDK 50).
      - dependency-name: "lottie-react-native"
      # typescript 5.1 -> 5.9 in a group added five type errors (FlatList item typed
      # unknown in LevelSelectionScreen); patch bumps only, minors are a deliberate task.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
